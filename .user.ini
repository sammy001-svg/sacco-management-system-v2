; PHP settings for cPanel (PHP-FPM / CGI reads this file automatically;
; changes can take up to 5 minutes to apply). Adjust in cPanel →
; "MultiPHP INI Editor" instead if your host ignores .user.ini.

; Uploads: KYC documents (5 MB) and import files (15 MB)
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 5

; Imports, interest runs and backups run in short batches, but give them room
max_execution_time = 120
max_input_time = 120
memory_limit = 256M

; Production safety
display_errors = Off
log_errors = On
expose_php = Off
session.cookie_httponly = 1
session.use_strict_mode = 1
session.use_only_cookies = 1
